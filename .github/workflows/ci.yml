name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rabab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rabab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabab_test
      NODE_ENV: test
      SESSION_SECRET: ci-auth-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Validate Vercel configuration
        run: pnpm run check:vercel-config

      - name: Test trusted frontend origin policy
        run: pnpm --filter @workspace/api-server run test:origin-policy

      - name: Test owner-only access policy
        run: pnpm --filter @workspace/api-server run test:owner-access

      - name: Test owner-only access gate
        run: pnpm --filter @workspace/api-server run test:owner-access-integration

      - name: Test safe ZIP extraction limits
        run: pnpm --filter @workspace/api-server run test:safe-zip

      - name: Provision isolated authentication test database
        run: pnpm --filter @workspace/db run push-force

      - name: Test authentication flow against isolated PostgreSQL
        run: pnpm --filter @workspace/api-server run test:auth

      - name: Test consultation quota safety against isolated PostgreSQL
        run: pnpm --filter @workspace/api-server run test:chat

      - name: Build production artifacts
        run: pnpm run build

      - name: Smoke-test Vercel API entrypoint
        run: pnpm run smoke:vercel-api
