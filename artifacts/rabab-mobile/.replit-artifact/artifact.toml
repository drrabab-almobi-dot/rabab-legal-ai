kind = "mobile"
previewPath = "/rabab-mobile/"
title = "RABAB LEGAL – تطبيق الجوال"
version = "1.0.0"
id = "artifacts/rabab-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/rabab-mobile/" ]
localPort = 20335

[services.development]
run = "pnpm --filter @workspace/rabab-mobile run dev"

[services.production]
run = [ "pnpm", "--filter", "@workspace/rabab-mobile", "run", "serve" ]

[services.env]
PORT = "20335"
BASE_PATH = "/rabab-mobile/"
